services:
  llama-server:
    image: rocket-runtime:local
    command: ["bash", "-c", "exec llama-server -m /models/$${MODEL_FILE}"]
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MODEL_FILE: ${MODEL_FILE:-gemma-4-E2B-it-BF16.gguf}
      LLAMA_ARG_ALIAS: ${LLAMA_ARG_ALIAS:-gemma-4-e2b-it}
      LLAMA_ARG_CTX_SIZE: "32768"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_BATCH: "2048"
      LLAMA_ARG_UBATCH: "512"
      LLAMA_ARG_N_GPU_LAYERS: "0"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_FLASH_ATTN: "off"
      GGML_BACKEND_PATH: /opt/rocket/libggml-rocket.so
    volumes:
      - /models:/models:ro
      - /dev/accel:/dev/accel
    privileged: true
    stop_grace_period: 30s
